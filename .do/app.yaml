static_sites:
  - name: portal
    github:
      repo: TIJNAKAO/jnk-portal
      branch: master
      deploy_on_push: true
    source_dir: /
    build_command: npm install && npm run build:shared && npm run build:portal
    output_dir: apps/portal/dist
    # OBRIGATÓRIO para uma SPA. Sem isto, só "/" responde: qualquer acesso
    # direto a uma rota do React (recarregar em /modules, abrir um link de
    # /faturamento/notas-fiscais, F5 em qualquer tela) faz o servidor estático
    # procurar um arquivo naquele caminho, não achar, e devolver 404 — mesmo
    # com a aplicação inteira funcionando. Navegar a partir da raiz esconde o
    # problema, porque aí o roteamento acontece no cliente.
    catchall_document: index.html
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        value: https://portal.jnakao.com.br/api
      - key: VITE_APP_VERSION
        value: "0.1.0"

domains:
  - domain: portal.jnakao.com.br
    type: PRIMARY
