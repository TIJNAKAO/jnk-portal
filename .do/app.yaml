# Template do App Spec do DigitalOcean App Platform pro jnk-portal.
# NUNCA preencha valores reais de segredo (senha, JWT_SECRET,
# PARAMETROS_ENCRYPTION_KEY, certificado CA) diretamente neste arquivo se for
# commitar — cole os valores reais na hora de criar/editar o app pelo painel
# da DO (campos "SECRET" ficam criptografados do lado da DO, fora do git).
# Ver Specs/deploy_digitalocean.md para o passo a passo completo.
#
# Uso: DigitalOcean → Apps → Create App → "Edit Your App Spec" → cole este
# YAML (ajustando os valores marcados com ALTERAR-AQUI) — ou
# `doctl apps create --spec .do/app.yaml` pela CLI.

name: jnk-portal
region: nyc

services:
  - name: api
    github:
      repo: TIJNAKAO/jnk-portal
      branch: master
      deploy_on_push: true
    source_dir: /
    build_command: npm install && npm run build:shared && npm run build:api
    run_command: npm run start --workspace=apps/api
    http_port: 3001
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /api
        preserve_path_prefix: true
      - path: /downloads
        preserve_path_prefix: true
    envs:
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        value: https://portal.jnakao.com.br
      - key: APP_VERSION
        value: "0.1.0"
      - key: DB_HOST
        value: ALTERAR-AQUI # host do cluster MySQL (painel DO -> Databases -> Connection Details)
      - key: DB_PORT
        value: "25060"
      - key: DB_USER
        value: doadmin
      - key: DB_PASSWORD
        type: SECRET
        value: ALTERAR-AQUI
      - key: DB_NAME
        value: jnk_portal_base
      - key: DB_CA_CERT
        type: SECRET
        value: ALTERAR-AQUI # conteúdo do ca-certificate.crt baixado no painel, colado inteiro (ver .do/app.yaml.local pro formato de block scalar)
      - key: JWT_SECRET
        type: SECRET
        value: ALTERAR-AQUI # gerar com: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PARAMETROS_ENCRYPTION_KEY
        type: SECRET
        value: ALTERAR-AQUI # gerar com: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: AZURE_AD_TENANT_ID
        value: ""
      - key: AZURE_AD_CLIENT_ID
        value: ""
      - key: AZURE_AD_CLIENT_SECRET
        value: ""
      - key: AZURE_AD_REDIRECT_URI
        value: ""

jobs:
  - name: cron-notas-fiscais
    kind: SCHEDULED
    github:
      repo: TIJNAKAO/jnk-portal
      branch: master
      deploy_on_push: true
    source_dir: /
    build_command: npm install && npm run build:shared
    run_command: npm run cron:sincronizar --workspace=apps/api -- notas_fiscais
    instance_size_slug: basic-xxs
    instance_count: 1
    schedule:
      cron: "30 * * * *"
      time_zone: America/Sao_Paulo
    envs:
      - key: DB_HOST
        value: ALTERAR-AQUI
      - key: DB_PORT
        value: "25060"
      - key: DB_USER
        value: doadmin
      - key: DB_PASSWORD
        type: SECRET
        value: ALTERAR-AQUI
      - key: DB_NAME
        value: jnk_portal_base
      - key: DB_CA_CERT
        type: SECRET
        value: ALTERAR-AQUI
      - key: PARAMETROS_ENCRYPTION_KEY
        type: SECRET
        value: ALTERAR-AQUI
  - name: cron-estoque
    kind: SCHEDULED
    github:
      repo: TIJNAKAO/jnk-portal
      branch: master
      deploy_on_push: true
    source_dir: /
    build_command: npm install && npm run build:shared
    run_command: npm run cron:sincronizar --workspace=apps/api -- estoque
    instance_size_slug: basic-xxs
    instance_count: 1
    schedule:
      cron: "15 * * * *"
      time_zone: America/Sao_Paulo
    envs:
      - key: DB_HOST
        value: ALTERAR-AQUI
      - key: DB_PORT
        value: "25060"
      - key: DB_USER
        value: doadmin
      - key: DB_PASSWORD
        type: SECRET
        value: ALTERAR-AQUI
      - key: DB_NAME
        value: jnk_portal_base
      - key: DB_CA_CERT
        type: SECRET
        value: ALTERAR-AQUI
      - key: PARAMETROS_ENCRYPTION_KEY
        type: SECRET
        value: ALTERAR-AQUI

static_sites:
  - name: portal
    github:
      repo: TIJNAKAO/jnk-portal
      branch: master
      deploy_on_push: true
    source_dir: /
    build_command: npm install && npm run build:shared && npm run build:portal
    output_dir: apps/portal/dist
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        value: https://portal.jnakao.com.br/api
      - key: VITE_APP_VERSION
        value: "0.1.0"

domains:
  - domain: portal.jnakao.com.br
    type: PRIMARY
