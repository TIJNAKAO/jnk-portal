# Template do App Spec do DigitalOcean App Platform pro jnk-portal.
# NUNCA preencha valores reais de segredo (senha, JWT_SECRET,
# PARAMETROS_ENCRYPTION_KEY, certificado CA) diretamente neste arquivo se for
# commitar — cole os valores reais na hora de criar/editar o app pelo painel
# da DO (campos "SECRET" ficam criptografados do lado da DO, fora do git).
# Ver Specs/deploy_digitalocean.md para o passo a passo completo.
#
# Uso: DigitalOcean → Apps → Create App → "Edit Your App Spec" → cole este
# YAML (ajustando os valores marcados com ALTERAR-AQUI) — ou
# `doctl apps create --spec .do/app.yaml` pela CLI.

name: jnk-portal
region: nyc

services:
  - name: api
    github:
      repo: TIJNAKAO/jnk-portal
      branch: master
      deploy_on_push: true
    source_dir: /
    build_command: npm install && npm run build:shared && npm run build:api
    run_command: npm run start --workspace=apps/api
    http_port: 3001
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /api
        preserve_path_prefix: true
      - path: /downloads
        preserve_path_prefix: true
    envs:
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        value: https://portal.jnakao.com.br
      - key: APP_VERSION
        value: "0.1.0"
      - key: DB_HOST
        value: ALTERAR-AQUI # host do cluster MySQL (painel DO -> Databases -> Connection Details)
      - key: DB_PORT
        value: "25060"
      - key: DB_USER
        value: doadmin
      - key: DB_PASSWORD
        type: SECRET
        value: ALTERAR-AQUI
      - key: DB_NAME
        value: jnk_portal_base
      - key: DB_CA_CERT
        type: SECRET
        value: ALTERAR-AQUI # conteúdo do ca-certificate.crt baixado no painel, colado inteiro (ver .do/app.yaml.local pro formato de block scalar)
      - key: JWT_SECRET
        type: SECRET
        value: ALTERAR-AQUI # gerar com: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PARAMETROS_ENCRYPTION_KEY
        type: SECRET
        value: ALTERAR-AQUI # gerar com: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: AZURE_AD_TENANT_ID
        value: ""
      - key: AZURE_AD_CLIENT_ID
        value: ""
      - key: AZURE_AD_CLIENT_SECRET
        value: ""
      - key: AZURE_AD_REDIRECT_URI
        value: ""

jobs:
  # Migrations do banco, antes de a versao nova receber trafego.
  #
  # PRE_DEPLOY roda com o codigo NOVO mas com a versao ANTIGA ainda
  # servindo, e falha aqui ABORTA o deploy - o app nunca fica rodando
  # contra um schema que ele nao espera. Antes deste job, aplicar
  # migration era passo manual no Console, e esquecer dele subia codigo
  # sem tabela: foi o que aconteceu com o Fechamento de Custo.
  #
  # Isso impoe uma regra as migrations: elas precisam ser ADITIVAS e
  # compativeis com o codigo antigo, porque ele continua atendendo
  # requisicao enquanto este job roda. Criar tabela ou coluna e seguro;
  # remover ou renomear coluna que a versao antiga le derruba producao
  # durante a janela do deploy. Ver Specs/deploy_digitalocean.md, secao 7.
  #
  # Reexecutar e inofensivo: o runner registra em schema_migrations e
  # pula o que ja foi aplicado, entao todo deploy pode rodar este job.
  #
  # So as DB_* aqui: JWT_SECRET e PARAMETROS_ENCRYPTION_KEY sao lazy em
  # src/config/env.ts e o runner nao os toca - segredo que o job nao
  # precisa e segredo que ele nao deve receber.
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: TIJNAKAO/jnk-portal
      branch: master
      deploy_on_push: true
    source_dir: /
    build_command: npm install && npm run build:shared
    run_command: npm run migrate --workspace=apps/api
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: DB_HOST
        value: ALTERAR-AQUI
      - key: DB_PORT
        value: "25060"
      - key: DB_USER
        value: doadmin
      - key: DB_PASSWORD
        type: SECRET
        value: ALTERAR-AQUI
      - key: DB_NAME
        value: jnk_portal_base
      - key: DB_CA_CERT
        type: SECRET
        value: ALTERAR-AQUI

  - name: cron-notas-fiscais
    kind: SCHEDULED
    github:
      repo: TIJNAKAO/jnk-portal
      branch: master
      deploy_on_push: true
    source_dir: /
